"$schema" = 'https://starship.rs/config-schema.json'
format = """
$directory\
$git_branch\
$git_status\
$fill\
$lua\
$rust\
$python\
$bun\
$nodejs\
$aws\
$docker_context\
$jobs\
$cmd_duration\
$line_break\
$character"""

command_timeout = 2000

[fill]
symbol = ' '

[bun]
format = 'via [🍔 $version](bold green) '

[directory]
style = 'bg:dark blue fg:white'

[rust]
style = 'bold red'



